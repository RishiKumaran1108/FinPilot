services:
  - type: web
    name: FinPilot
    env: static
    buildCommand: rm -rf node_modules && npm install && npm run build
    staticPublishPath: .output/public
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NITRO_PRESET
        value: node-server
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
